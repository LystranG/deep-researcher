server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /healthz {
        proxy_pass http://api:8000/healthz;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

