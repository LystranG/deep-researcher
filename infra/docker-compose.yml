services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: deep_researcher
      POSTGRES_USER: deep_researcher
      POSTGRES_PASSWORD: deep_researcher
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deep_researcher"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      DEEP_RESEARCHER_DATABASE_URL: postgresql+psycopg://deep_researcher:deep_researcher@postgres:5432/deep_researcher
      DEEP_RESEARCHER_OBJECT_STORE_ROOT: /data/objects
      DEEP_RESEARCHER_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEP_RESEARCHER_OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - object-data:/data/objects

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  postgres-data:
  object-data:
