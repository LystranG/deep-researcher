services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17
    environment:
      POSTGRES_DB: deep_researcher
      POSTGRES_USER: deep_researcher
      POSTGRES_PASSWORD: deep_researcher
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deep_researcher"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      DEEP_RESEARCHER_DATABASE_URL: postgresql+psycopg://deep_researcher:deep_researcher@postgres:5432/deep_researcher
      DEEP_RESEARCHER_OBJECT_STORE_ROOT: /data/objects
      DEEP_RESEARCHER_EMBEDDED_WORKER: "0"
      DEEP_RESEARCHER_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEP_RESEARCHER_OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      DEEP_RESEARCHER_EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      DEEP_RESEARCHER_EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
      DEEP_RESEARCHER_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      DEEP_RESEARCHER_RERANK_API_KEY: ${RERANK_API_KEY:-}
      DEEP_RESEARCHER_RERANK_API_BASE: ${RERANK_API_BASE:-}
      DEEP_RESEARCHER_RERANK_MODEL: ${RERANK_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - object-data:/data/objects

  worker:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      DEEP_RESEARCHER_DATABASE_URL: postgresql+psycopg://deep_researcher:deep_researcher@postgres:5432/deep_researcher
      DEEP_RESEARCHER_OBJECT_STORE_ROOT: /data/objects
      DEEP_RESEARCHER_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEP_RESEARCHER_OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      DEEP_RESEARCHER_EMBEDDED_WORKER: "0"
    command: ["sh", "-c", "uv run alembic upgrade head && uv run python -m deep_researcher.worker_main"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - object-data:/data/objects
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  postgres-data:
  object-data:
