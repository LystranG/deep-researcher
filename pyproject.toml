[project]
name = "deep-researcher"
version = "0.1.0"
description = "以空间为边界的深度研究工作台"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2",
  "email-validator>=2.3,<3",
  "fastapi>=0.135,<0.136",
  "httpx>=0.28,<0.29",
  "jsonschema>=4.26,<5",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "litellm>=1.95,<2",
  "mcp>=2.0,<3",
  "openai>=2.21,<3",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<0.1",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
deep-researcher-worker = "deep_researcher.worker_main:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=7,<8",
  "reportlab>=4.4,<5",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.24,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/deep_researcher"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["apps/api/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["deep_researcher"]
mypy_path = "apps/api/src"
